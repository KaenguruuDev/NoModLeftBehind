modLoader = "javafml"
loaderVersion="[1,)"
license="${license}"
showAsResourcePack=false

issueTrackerURL = "https://github.com/${github}/${name}/issues"

[[mods]]
modId="${id}"
version="${modversion}"
displayName="${display_name}"
authors="${author}"
description="${description}"
displayURL = "https://github.com/${github}/${name}/"

[[dependencies."${id}"]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."${id}"]]
modId="minecraft"
mandatory=true
versionRange="${mc}"
ordering="NONE"
side="BOTH"
